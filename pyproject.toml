[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra-research"
version = "0.4.0"
description = "Evidence before answers: local-first, reproducible research with source-linked evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vajra contributors" }]
dependencies = ["ddgs==9.16.0", "mcp==2.2.0"]

[project.scripts]
vajra = "vajra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
